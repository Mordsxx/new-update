
name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract and locate project files
      - name: Unpack project files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $workspace = $env:GITHUB_WORKSPACE

          if (Test-Path "project.zip") {
              Write-Host "Extracting project.zip..."

              if (Test-Path "_project") {
                  Remove-Item "_project" -Recurse -Force
              }

              Expand-Archive -Path "project.zip" -DestinationPath "_project" -Force

              $mainFiles = @(Get-ChildItem "_project" -Filter "main.py" -File -Recurse)

              $projectRoot = $null

              foreach ($file in $mainFiles) {
                  $dir = $file.Directory.FullName

                  $required = @(
                      "requirements.txt",
                      "core",
                      "engines",
                      "gui"
                  )

                  $valid = $true

                  foreach ($item in $required) {
                      if (-not (Test-Path (Join-Path $dir $item))) {
                          $valid = $false
                          break
                      }
                  }

                  if ($valid) {
                      $projectRoot = $dir
                      break
                  }
              }

              if (-not $projectRoot) {
                  throw "Could not find a valid project root containing main.py, requirements.txt, core, engines and gui."
              }

              Write-Host "Project found at: $projectRoot"

              Get-ChildItem -Path $projectRoot -Force | ForEach-Object {
                  Copy-Item -Path $_.FullName -Destination $workspace -Recurse -Force
              }

              Write-Host "Project files copied successfully."

          } else {
              Write-Host "project.zip not found. Using repository files."
          }

          Get-ChildItem -Name

      # 3. Verify project structure
      - name: Check project files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
              "main.py",
              "requirements.txt",
              "core",
              "engines",
              "gui"
          )

          $missing = @()

          foreach ($item in $required) {
              if (-not (Test-Path $item)) {
                  $missing += $item
              }
          }

          if ($missing.Count -gt 0) {
              throw "Missing project files: $($missing -join ', ')"
          }

          if (-not (Test-Path "assets")) {
              New-Item -ItemType Directory -Path "assets" | Out-Null
              Write-Warning "Assets folder not found."
          }

          Write-Host "All required project files found!"
          Get-ChildItem -Name

      # 4. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # 5. Install dependencies
      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install pyinstaller

      # 6. Download FFmpeg
      - name: Download FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path bin | Out-Null

          Invoke-WebRequest `
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" `
            -OutFile ffmpeg.zip

          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force

          $binaries = Get-ChildItem ffmpeg_tmp -Recurse -File |
              Where-Object { $_.Name -in @("ffmpeg.exe", "ffprobe.exe") }

          foreach ($file in $binaries) {
              Copy-Item $file.FullName bin/ -Force
          }

          if (-not (Test-Path "bin/ffmpeg.exe")) {
              throw "FFmpeg executable was not found."
          }

          Write-Host "FFmpeg installed successfully."

      # 7. Download RIFE
      - name: Download RIFE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path models | Out-Null

          Invoke-WebRequest `
            "https://github.com/nihui/rife-ncnn-vulkan/releases/download/20221029/rife-ncnn-vulkan-20221029-windows.zip" `
            -OutFile rife.zip

          Expand-Archive rife.zip -DestinationPath models -Force

          $rife = Get-ChildItem models -Recurse -Filter "rife-ncnn-vulkan.exe" |
              Select-Object -First 1

          if (-not $rife) {
              throw "RIFE executable was not found."
          }

          Write-Host "RIFE found: $($rife.FullName)"

      # 8. Run tests
      - name: Run tests
        shell: pwsh
        continue-on-error: true
        run: |
          if (Test-Path "tests") {
              python -m unittest discover -s tests -v
          } else {
              Write-Host "No tests folder. Skipping."
          }

      # 9. Build EXE
      - name: Build executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pyArgs = @(
              "--noconfirm",
              "--clean",
              "--windowed",
              "--name", "Flowframes-TikTok60FPS-Studio",
              "--add-data", "assets;assets",
              "--add-data", "bin;bin",
              "--add-data", "models;models",
              "--collect-all", "customtkinter"
          )

          if (Test-Path "assets/icon.ico") {
              $pyArgs += @("--icon", "assets/icon.ico")
          }

          Write-Host "Starting PyInstaller..."

          pyinstaller @pyArgs main.py

          if ($LASTEXITCODE -ne 0) {
              throw "PyInstaller build failed."
          }

          if (-not (Test-Path "dist/Flowframes-TikTok60FPS-Studio")) {
              throw "EXE output folder was not created."
          }

          Write-Host "Build completed successfully."

      # 10. Package
      - name: Package application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $output = "Flowframes-TikTok60FPS-Studio-win64.zip"

          if (Test-Path $output) {
              Remove-Item $output -Force
          }

          Compress-Archive `
            -Path "dist/Flowframes-TikTok60FPS-Studio" `
            -DestinationPath $output `
            -CompressionLevel Optimal

          Write-Host "Application packaged successfully."

      # 11. Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flowframes-TikTok60FPS-Studio-win64
          path: Flowframes-TikTok60FPS-Studio-win64.zip
          if-no-files-found: error
          retention-days: 30

      # 12. Publish GitHub Release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Flowframes-TikTok60FPS-Studio-win64.zip
          generate_release_notes: true
