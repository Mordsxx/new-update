name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download FFmpeg (bundled with the app)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path bin, models | Out-Null
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          Get-ChildItem ffmpeg_tmp -Recurse -Include ffmpeg.exe, ffprobe.exe | ForEach-Object { Copy-Item $_.FullName bin/ -Force }
          Get-ChildItem bin

      - name: Download RIFE (rife-ncnn-vulkan + models)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path models | Out-Null
          Invoke-WebRequest "https://github.com/nihui/rife-ncnn-vulkan/releases/download/20221029/rife-ncnn-vulkan-20221029-windows.zip" -OutFile rife.zip
          Expand-Archive rife.zip -DestinationPath models -Force
          Get-ChildItem models -Recurse -Filter rife-ncnn-vulkan.exe | Select-Object -First 1 | ForEach-Object { Write-Host "Found $($_.FullName)" }

      - name: Run tests
        shell: pwsh
        run: |
          if (Test-Path tests) { python -m unittest discover -s tests -v } else { Write-Host "tests folder not found - skipping" }

      - name: Check project files
        shell: pwsh
        run: |
          $missing = @()
          foreach ($p in "main.py", "requirements.txt", "core", "engines", "gui") { if (-not (Test-Path $p)) { $missing += $p } }
          if ($missing.Count -gt 0) { throw "These files/folders are missing from the repository: $($missing -join ', ')" }
          if (-not (Test-Path assets)) { Write-Warning "assets folder missing - upload it to get the custom icon"; New-Item -ItemType Directory assets | Out-Null }
          Get-ChildItem -Name

      - name: Build executable
        shell: pwsh
        run: |
          $pyArgs = @("--noconfirm", "--clean", "--windowed", "--name", "Flowframes-TikTok60FPS-Studio",
                      "--add-data", "assets;assets", "--add-data", "bin;bin", "--add-data", "models;models",
                      "--collect-all", "customtkinter")
          if (Test-Path "assets/icon.ico") { $pyArgs += @("--icon", "assets/icon.ico") }
          pyinstaller @pyArgs main.py

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "dist/Flowframes-TikTok60FPS-Studio" -DestinationPath "Flowframes-TikTok60FPS-Studio-win64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Flowframes-TikTok60FPS-Studio-win64
          path: Flowframes-TikTok60FPS-Studio-win64.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Flowframes-TikTok60FPS-Studio-win64.zip
