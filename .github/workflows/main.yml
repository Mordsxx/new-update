
name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Extract project
      - name: Extract project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $workspace = $env:GITHUB_WORKSPACE

          if (Test-Path "project.zip") {
              Expand-Archive project.zip -DestinationPath _project -Force

              $projectRoot = $null

              Get-ChildItem "_project" -Filter "main.py" -File -Recurse | ForEach-Object {
                  $dir = $_.Directory.FullName

                  if (
                      (Test-Path "$dir/requirements.txt") -and
                      (Test-Path "$dir/core") -and
                      (Test-Path "$dir/engines") -and
                      (Test-Path "$dir/gui")
                  ) {
                      if (-not $projectRoot) {
                          $projectRoot = $dir
                      }
                  }
              }

              if (-not $projectRoot) {
                  throw "Project structure is invalid."
              }

              Get-ChildItem $projectRoot -Force | ForEach-Object {
                  Copy-Item $_.FullName $workspace -Recurse -Force
              }
          }

          $required = @(
              "main.py",
              "requirements.txt",
              "core",
              "engines",
              "gui"
          )

          foreach ($item in $required) {
              if (-not (Test-Path $item)) {
                  throw "Missing required file: $item"
              }
          }

          if (-not (Test-Path "assets")) {
              New-Item -ItemType Directory assets | Out-Null
          }

      # 3. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 5. Download FFmpeg
      - name: Download FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force bin | Out-Null

          Invoke-WebRequest `
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" `
            -OutFile ffmpeg.zip

          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force

          Get-ChildItem ffmpeg_tmp -Recurse -File |
            Where-Object { $_.Name -in @("ffmpeg.exe", "ffprobe.exe") } |
            ForEach-Object {
              Copy-Item $_.FullName bin/ -Force
            }

          if (-not (Test-Path "bin/ffmpeg.exe")) {
              throw "FFmpeg download failed."
          }

      # 6. Download RIFE
      - name: Download RIFE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force models | Out-Null

          Invoke-WebRequest `
            "https://github.com/nihui/rife-ncnn-vulkan/releases/download/20221029/rife-ncnn-vulkan-20221029-windows.zip" `
            -OutFile rife.zip

          Expand-Archive rife.zip -DestinationPath models -Force

          $rife = Get-ChildItem models -Recurse -Filter "rife-ncnn-vulkan.exe" |
            Select-Object -First 1

          if (-not $rife) {
              throw "RIFE executable not found."
          }

      # 7. Build EXE
      - name: Build executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pyArgs = @(
              "--noconfirm",
              "--clean",
              "--windowed",
              "--name", "Flowframes-TikTok60FPS-Studio",
              "--add-data", "assets;assets",
              "--add-data", "bin;bin",
              "--add-data", "models;models",
              "--collect-all", "customtkinter"
          )

          if (Test-Path "assets/icon.ico") {
              $pyArgs += @("--icon", "assets/icon.ico")
          }

          pyinstaller @pyArgs main.py

          if ($LASTEXITCODE -ne 0) {
              throw "PyInstaller build failed."
          }

      # 8. Package
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/Flowframes-TikTok60FPS-Studio" `
            -DestinationPath "Flowframes-TikTok60FPS-Studio-win64.zip" `
            -CompressionLevel Optimal

      # 9. Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flowframes-TikTok60FPS-Studio-win64
          path: Flowframes-TikTok60FPS-Studio-win64.zip
          if-no-files-found: error
          retention-days: 30

      # 10. GitHub Release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Flowframes-TikTok60FPS-Studio-win64.zip
          generate_release_notes: true
