
name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($file in @("main.py", "requirements.txt")) {
              if (-not (Test-Path $file)) {
                  throw "Missing: $file"
              }
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force bin | Out-Null

          Invoke-WebRequest `
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" `
            -OutFile ffmpeg.zip

          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force

          Get-ChildItem ffmpeg_tmp -Recurse -File |
            Where-Object { $_.Name -in @("ffmpeg.exe", "ffprobe.exe") } |
            ForEach-Object {
              Copy-Item $_.FullName bin/ -Force
            }

          if (-not (Test-Path "bin/ffmpeg.exe")) {
              throw "FFmpeg not found."
          }

      - name: Download RIFE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force models | Out-Null

          Invoke-WebRequest `
            "https://github.com/nihui/rife-ncnn-vulkan/releases/download/20221029/rife-ncnn-vulkan-20221029-windows.zip" `
            -OutFile rife.zip

          Expand-Archive rife.zip -DestinationPath models -Force

          $rife = Get-ChildItem models -Recurse -Filter "rife-ncnn-vulkan.exe" |
            Select-Object -First 1

          if (-not $rife) {
              throw "RIFE executable not found."
          }

      - name: Build executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pyArgs = @(
              "--noconfirm",
              "--clean",
              "--windowed",
              "--name", "Flowframes-TikTok60FPS-Studio",
              "--add-data", "bin;bin",
              "--add-data", "models;models",
              "--collect-all", "customtkinter"
          )

          if (Test-Path "icon.ico") {
              $pyArgs += @("--icon", "icon.ico")
          }

          if (Test-Path "icon.png") {
              $pyArgs += @("--add-data", "icon.png;.")
          }

          pyinstaller @pyArgs main.py

          if ($LASTEXITCODE -ne 0) {
              throw "Build failed."
          }

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/Flowframes-TikTok60FPS-Studio" `
            -DestinationPath "Flowframes-TikTok60FPS-Studio-win64.zip" `
            -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flowframes-TikTok60FPS-Studio-win64
          path: Flowframes-TikTok60FPS-Studio-win64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Flowframes-TikTok60FPS-Studio-win64.zip
          generate_release_notes: true
