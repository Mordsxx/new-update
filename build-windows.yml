name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download FFmpeg (bundled with the app)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          Copy-Item ffmpeg_tmp/*/bin/ffmpeg.exe bin/
          Copy-Item ffmpeg_tmp/*/bin/ffprobe.exe bin/

      - name: Download RIFE (rife-ncnn-vulkan + models)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest "https://github.com/nihui/rife-ncnn-vulkan/releases/download/20221029/rife-ncnn-vulkan-20221029-windows.zip" -OutFile rife.zip
          Expand-Archive rife.zip -DestinationPath models
          Get-ChildItem models -Recurse -Filter rife-ncnn-vulkan.exe | Select-Object -First 1 | ForEach-Object { Write-Host "Found $($_.FullName)" }

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "Flowframes-TikTok60FPS-Studio" `
            --icon assets/icon.ico `
            --add-data "assets;assets" --add-data "bin;bin" --add-data "models;models" `
            --collect-all customtkinter `
            main.py

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "dist/Flowframes-TikTok60FPS-Studio" -DestinationPath "Flowframes-TikTok60FPS-Studio-win64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Flowframes-TikTok60FPS-Studio-win64
          path: Flowframes-TikTok60FPS-Studio-win64.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Flowframes-TikTok60FPS-Studio-win64.zip
